<svg xmlns="http://www.w3.org/2000/svg" width="900" height="383" viewBox="0 0 900 383">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="0.55" stop-color="#0b2a3d"/>
      <stop offset="1" stop-color="#063b45"/>
    </linearGradient>
    <radialGradient id="glow" cx="75%" cy="35%" r="55%">
      <stop offset="0" stop-color="#28e6ff" stop-opacity="0.42"/>
      <stop offset="0.48" stop-color="#00b7ff" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#00b7ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#152538"/>
      <stop offset="1" stop-color="#071421"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
    <style>
      .font{font-family:'Hiragino Sans GB','Heiti SC','PingFang SC','Microsoft YaHei',sans-serif;}
      .title{font-size:52px;font-weight:800;letter-spacing:1px;fill:#ffffff;}
      .sub{font-size:24px;font-weight:600;fill:#bff7ff;}
      .tag{font-size:19px;font-weight:700;fill:#062030;}
      .small{font-size:18px;font-weight:700;fill:#d6faff;}
      .mini{font-size:16px;font-weight:500;fill:#7fefff;}
    </style>
  </defs>

  <rect width="900" height="383" fill="url(#bg)"/>
  <rect width="900" height="383" fill="url(#glow)"/>
  <circle cx="705" cy="42" r="120" fill="#0fd6ff" opacity="0.16" filter="url(#soft)"/>
  <circle cx="790" cy="310" r="150" fill="#21ffbd" opacity="0.10" filter="url(#soft)"/>

  <g opacity="0.25" stroke="#51e8ff" stroke-width="1.5" fill="none">
    <path d="M45 65 H150 Q170 65 170 85 V122"/>
    <path d="M756 68 H850"/>
    <path d="M786 68 V122 H872"/>
    <path d="M520 340 H635 Q652 340 652 318 V300"/>
    <circle cx="170" cy="122" r="4" fill="#51e8ff"/>
    <circle cx="756" cy="68" r="4" fill="#51e8ff"/>
    <circle cx="652" cy="300" r="4" fill="#51e8ff"/>
  </g>

  <g class="font">
    <rect x="48" y="38" width="126" height="34" rx="17" fill="#39f7c9"/>
    <text x="111" y="61" class="tag" text-anchor="middle">Hi时刻教程</text>

    <text x="48" y="130" class="title">华为 HiCar</text>
    <text x="48" y="194" class="title">盒子使用简介</text>
    <text x="50" y="236" class="sub">老车机升级 HiCar，看这一篇就够了</text>

    <g transform="translate(50 267)">
      <rect x="0" y="0" width="118" height="34" rx="17" fill="#123047" stroke="#37dfff" opacity="0.95"/>
      <text x="59" y="23" class="small" text-anchor="middle">连接方式</text>
      <rect x="132" y="0" width="118" height="34" rx="17" fill="#123047" stroke="#37dfff" opacity="0.95"/>
      <text x="191" y="23" class="small" text-anchor="middle">后台设置</text>
      <rect x="264" y="0" width="118" height="34" rx="17" fill="#123047" stroke="#37dfff" opacity="0.95"/>
      <text x="323" y="23" class="small" text-anchor="middle">购买建议</text>
    </g>

    <text x="50" y="350" class="mini">CarPlay / CarLife / 安卓客户端 · 无线 / 有线连接 · 兼容性确认</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="548" y="106" width="268" height="166" rx="25" fill="#020813" stroke="#1fb9d5" stroke-width="3"/>
    <rect x="566" y="123" width="232" height="130" rx="16" fill="url(#card)" stroke="#1a5e73"/>
    <rect x="586" y="141" width="90" height="42" rx="11" fill="#0ed3ff" opacity="0.9"/>
    <text x="631" y="169" class="font" font-size="21" font-weight="800" fill="#06101b" text-anchor="middle">HiCar</text>
    <rect x="586" y="200" width="55" height="40" rx="10" fill="#183f59" stroke="#31e7ff"/>
    <path d="M600 221 q13 -16 27 0 q-14 16 -27 0" fill="none" stroke="#aafaff" stroke-width="3"/>
    <rect x="657" y="200" width="55" height="40" rx="10" fill="#183f59" stroke="#31e7ff"/>
    <circle cx="684" cy="220" r="11" fill="none" stroke="#aafaff" stroke-width="3"/>
    <path d="M684 209 v22 M673 220 h22" stroke="#aafaff" stroke-width="3"/>
    <rect x="728" y="200" width="48" height="40" rx="10" fill="#183f59" stroke="#31e7ff"/>
    <path d="M743 213 h18 v18 h-18z" fill="none" stroke="#aafaff" stroke-width="3"/>
  </g>

  <g filter="url(#shadow)">
    <rect x="638" y="296" width="130" height="58" rx="18" fill="#071521" stroke="#2de6ff" stroke-width="3"/>
    <circle cx="671" cy="325" r="12" fill="#2df7cb"/>
    <rect x="704" y="316" width="38" height="18" rx="5" fill="#16344a" stroke="#96faff"/>
    <text x="703" y="374" class="font" font-size="17" font-weight="700" fill="#ffffff" text-anchor="middle">HiCar 盒子</text>
  </g>

  <g fill="none" stroke="#45f6ff" stroke-width="4" stroke-linecap="round" opacity="0.8">
    <path d="M692 289 C692 274 706 268 721 275"/>
    <path d="M674 280 C692 252 731 251 752 278" opacity="0.65"/>
    <path d="M657 270 C690 232 748 232 781 271" opacity="0.45"/>
  </g>
</svg>
